# 放在 /etc/nginx/conf.d/agentflow.conf。
# 两件事不做就白搭：WebSocket 的 Upgrade 头（否则实时日志连不上，前端只能退回轮询），
# 和 X-Forwarded-For（否则 AgentFlow 看到的每个访客都是 127.0.0.1，限流会整站共用一份额度，
# 这时要同时把 AGENTFLOW_TRUST_PROXY 设为 1）。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # 导入的工作流 JSON 会走请求体
    client_max_body_size 2m;

    location / {
        # docker-compose.yml 把容器的 8000 映射到宿主 8001
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 一条长流程可能在模型节点上挂几分钟，别让它死在默认 60s 读超时上
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # 日志是一帧一帧推的，缓冲起来就失去实时性了
        proxy_buffering off;
    }
}
