services:
  agentflow:
    build:
      context: .
      args:
        # 国内宿主机从默认 PyPI 拉依赖只有几十 kB/s，部署时在 .env 里
        # 设 PIP_INDEX_URL 指向镜像站。
        - PIP_INDEX_URL=${PIP_INDEX_URL:-https://pypi.org/simple}
    ports:
      - "8001:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=sqlite:///./data/workflows.db
    volumes:
      # 命名卷而不是 ./data 绑定挂载：镜像里的 /app/backend/data 属于非 root 的 app
      # 用户，Docker 初始化命名卷时会带上这个属主；绑定挂载则直接用宿主目录的
      # root:root，SQLite 写不进去。
      - agentflow-data:/app/backend/data
    restart: unless-stopped

volumes:
  agentflow-data:
